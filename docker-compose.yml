services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CONFIG_FORGE_DB_PATH: /app/data/config_forge.sqlite3
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8040:8040"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: 8120
    depends_on:
      - backend
    ports:
      - "8120:8120"
